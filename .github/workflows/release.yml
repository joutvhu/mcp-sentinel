name: Release & Multi-Channel Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # 1. Build release binaries for all operating systems & architectures
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: mcp-sentinel.exe
            archive_ext: zip

          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: mcp-sentinel
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: mcp-sentinel
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: mcp-sentinel
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ArchiveName = "mcp-sentinel-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath $ArchiveName -Force
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash *$ArchiveName" | Out-File -FilePath "$ArchiveName.sha256" -Encoding ascii

      - name: Package release artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE_NAME="mcp-sentinel-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            mcp-sentinel-${{ matrix.target }}.${{ matrix.archive_ext }}
            mcp-sentinel-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  # 2. Automatically publish to Crates.io (requires CARGO_REGISTRY_TOKEN in GitHub Secrets)
  publish-crates-io:
    name: Publish to Crates.io
    needs: build-release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev

      - name: Publish crate to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  # 3. Automatically update Homebrew tap (supports GH_PAT, GH_PUBLISH_TOKEN, or HOMEBREW_TAP_TOKEN)
  publish-homebrew:
    name: Bump Homebrew Tap Formula
    needs: build-release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.GH_PAT || secrets.GH_PUBLISH_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Bump Homebrew formula
        if: env.TAP_TOKEN != ''
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: mcp-sentinel
          homebrew-tap: joutvhu/homebrew-tap
          base-branch: main
          download-url: https://github.com/joutvhu/mcp-sentinel/releases/download/${{ github.event.release.tag_name }}/mcp-sentinel-aarch64-apple-darwin.tar.gz
          commit-message: "chore(mcp-sentinel): update formula to ${{ github.event.release.tag_name }}"
        env:
          COMMITTER_TOKEN: ${{ env.TAP_TOKEN }}

  # 4. Automatically submit to Windows Package Manager / WinGet (supports GH_PAT, GH_PUBLISH_TOKEN, or WINGET_TOKEN)
  publish-winget:
    name: Submit to Windows WinGet
    needs: build-release
    runs-on: windows-latest
    env:
      WG_TOKEN: ${{ secrets.GH_PAT || secrets.GH_PUBLISH_TOKEN || secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to WinGet package repository
        if: env.WG_TOKEN != ''
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: joutvhu.mcp-sentinel
          version: ${{ github.event.release.tag_name }}
          installers-regex: '\.zip$'
          token: ${{ env.WG_TOKEN }}
