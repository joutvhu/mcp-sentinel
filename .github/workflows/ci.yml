name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MCP_SENTINEL_NON_INTERACTIVE: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev dbus-x11 gnome-keyring xvfb

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build debug binary
        run: cargo build --verbose

      - name: Run unit & integration tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            mkdir -p ~/.local/share/keyrings
            xvfb-run --auto-servernum dbus-run-session bash -c "
              mkdir -p ~/.local/share/keyrings
              eval \$(printf '\n' | gnome-keyring-daemon --unlock)
              eval \$(gnome-keyring-daemon --start --components=secrets)
              cargo test --verbose
            "
          elif [ "$RUNNER_OS" = "macOS" ]; then
            security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || security unlock-keychain -p "" ~/Library/Keychains/login.keychain || true
            security set-keychain-settings -lut 21600 ~/Library/Keychains/login.keychain-db || security set-keychain-settings -lut 21600 ~/Library/Keychains/login.keychain || true
            cargo test --verbose
          else
            cargo test --verbose
          fi
        shell: bash

      - name: Build release binary
        run: cargo build --release --verbose
